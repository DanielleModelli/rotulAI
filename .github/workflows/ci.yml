name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      - name: Rodar a suíte
        run: pytest tests/ -v

      # O registry só é populado pelo import do pacote. Se este passo falhar,
      # o DecisorAgent roda sem especialista nenhum e a condição C3 do
      # experimento vira, silenciosamente, um LLM puro.
      - name: Verificar que os agents reais estão registrados
        run: |
          python - <<'PY'
          import rotulai.agents
          from rotulai.agents.registry import get_registered_agents

          registrados = set(get_registered_agents())
          esperados = {"chocolate", "laticinios"}
          if not esperados <= registrados:
              raise SystemExit(f"registry incompleto: {sorted(registrados)}")
          print(f"registry ok: {sorted(registrados)}")
          PY
