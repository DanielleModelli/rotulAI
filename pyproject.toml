[project]
name = "rotulai"
version = "0.1.0"
description = "Sistema multiagent para identificar alérgenos escondidos em rótulos de alimentos"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
